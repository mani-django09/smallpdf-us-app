<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="head">
    <div class="head-top">
      <span class="brand"><svg class="brand-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="0" y="0" width="8" height="8" fill="#ff5400"/><rect x="8" y="0" width="8" height="8" fill="#ff8e00"/><rect x="16" y="0" width="8" height="8" fill="#ffd200"/><rect x="0" y="8" width="8" height="8" fill="#00c0ff"/><rect x="8" y="8" width="8" height="8" fill="#00d267"/><rect x="16" y="8" width="8" height="8" fill="#81e650"/><rect x="0" y="16" width="8" height="8" fill="#8b48fe"/><rect x="8" y="16" width="8" height="8" fill="#ca41fc"/><rect x="16" y="16" width="8" height="8" fill="#ff46fb"/></svg>SmallPDF<i>.us</i></span>
      <a id="open-site" class="head-link" href="#" title="Open smallpdf.us">
        smallpdf.us
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7"/><path d="M8 7h9v9"/>
        </svg>
      </a>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" type="search" placeholder="Search 27 tools… e.g. compress, word, jpg"
             autocomplete="off" spellcheck="false">
    </div>

    <nav id="filters" class="filters" aria-label="Tool categories"></nav>
  </header>

  <!-- Only rendered when the active tab is a file we can act on -->
  <section id="context-card" class="context-card" hidden>
    <div class="context-head">
      <span id="context-icon" class="context-icon"></span>
      <div class="context-text">
        <span class="context-label">Open in your tab · send it to</span>
        <span id="context-file" class="context-file"></span>
      </div>
    </div>
    <div id="context-actions" class="context-actions"></div>
    <p class="context-note">The file goes along — no need to download it first.</p>
  </section>

  <main id="body" class="body">
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>
      <span class="empty-mark">🔍</span>
      No tool matches that
    </p>
  </main>

  <footer class="foot">
    <label class="toggle" title="Lets right-click on a PDF link or image bring that file along, on any website">
      <input id="any-site" type="checkbox">
      <span class="toggle-track"><span class="toggle-dot"></span></span>
      Files from links &amp; images
    </label>
    <span class="hint"><kbd>Alt</kbd><kbd>⇧</kbd><kbd>P</kbd></span>
  </footer>

  <script src="tools.js"></script>
  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
